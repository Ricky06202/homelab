services:
  db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    image: nextcloud:stable
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    env_file: .env
    environment:
      NEXTCLOUD_TRUSTED_DOMAINS: nube.sanjur.internal localhost
    volumes:
      - ./html:/var/www/html
      - /mnt/Download/nextcloud-data:/var/www/html/data