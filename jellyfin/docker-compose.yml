services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - /mnt/Datos/Flix:/media:ro
    devices:
      - /dev/dri:/dev/dri