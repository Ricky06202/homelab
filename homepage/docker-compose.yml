services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=192.168.2.90:3010,127.0.0.1:3010,casa.sanjur.internal,*.sanjur.internal
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro