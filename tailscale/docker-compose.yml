services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: nas-sanjur
    restart: unless-stopped
    network_mode: host
    env_file: ts.env
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-routes=192.168.2.0/24
    volumes:
      - ./state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW