services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Montevideo
    volumes:
      - ./config:/config
      - /mnt/Download/descargas:/downloads
      - /mnt/Download/Flix/peliculas:/peliculas
    ports:
      - "7878:7878"
    restart: unless-stopped
